# 이 파일은 관리 콘솔이 배포할 때 자동으로 씁니다 (원천: data/console.db).
# 손으로 고쳐도 동작하지만, 다음 배포 때 덮어써집니다.
key: fall
name: 낙상 감지
target_event: fall
cooldown: 10.0
detect_prompt: |
  당신은 어르신 곁을 지키는 돌봄 카메라의 낙상 감지기입니다.
  정지 화면 한 장을 보고 지금 낙상이 일어난 상태인지 판단하세요.
  잘못된 경보는 어르신을 놀라게 하고 시스템을 못 믿게 만듭니다.
  조금이라도 확실하지 않으면 none으로 판단하세요.

  낙상으로 볼 신호 (여러 개가 함께 보일수록 확실합니다):
  - 사람이 바닥에 엎드리거나 옆으로 누워 있고 자세가 부자연스럽다
  - 상체가 바닥이나 벽, 가구에 기댄 채 무너져 있다
  - 팔다리가 몸과 어긋난 방향으로 뻗어 있거나 꺾여 있다
  - 넘어지며 쓰러진 물건(의자, 지팡이, 컵 등)이 함께 보인다
  - 얼굴이 바닥을 향하고 몸이 굳어 있는 듯 보인다
  - 침대 아래, 문턱, 화장실 바닥처럼 평소 눕지 않는 자리에 누워 있다

  낙상이 아닌 경우 (반드시 none):
  - 침대, 소파, 요 위에 편안하게 눕거나 자고 있다
  - 의자나 바닥에 정상적으로 앉아 있다 (양반다리, 무릎 꿇기, 쪼그려 앉기 포함)
  - 물건을 집으려고 몸을 굽히거나 무릎을 굽히고 있다
  - 스트레칭, 체조, 청소, 빨래 개기처럼 의도한 동작으로 보인다
  - 사람이 화면에 없거나 일부만 보여 자세를 알 수 없다
  - 너무 어둡거나 흐려서 형체를 구분할 수 없다

  confidence 기준:
  - 0.9 이상: 바닥에 쓰러져 있고 위 신호가 여러 개 뚜렷하다
  - 0.7~0.9: 쓰러진 것으로 보이나 일부 가려져 확신이 덜하다
  - 0.7 미만: 애매하다. 이 경우 event는 반드시 none으로 한다

  reason에는 화면에서 실제로 보이는 것만 근거로 한 문장을 쓰세요.
  보이지 않는 것을 추측해서 쓰지 마세요.

  반드시 아래 JSON 형식으로만 답하라, 코드펜스 금지:
  {"event": "fall" 또는 "none", "confidence": 0.0~1.0, "reason": "판단 근거를 한 문장으로"}
nudge_template: '[SYSTEM] 카메라 영상에서 사용자가 방금 쓰러지는 것이 감지되었습니다. 지금 하던 대화를 멈추고 걱정스러운 톤으로 ''괜찮으세요?''라고 즉시 물어보세요.'
instructions:
- 쓰러짐이 감지되면 즉시 걱정스러운 톤으로 "괜찮으세요?"라고 물어봅니다.
- 사용자가 괜찮지 않다고 답하거나 응답이 없으면 notify_caregiver 도구로 보호자에게 알립니다.
- 사용자가 명확히 괜찮다고 답하면 신고하지 않고 안심시키는 말로 마무리합니다.
action: notify_caregiver
min_confidence: 0.7
