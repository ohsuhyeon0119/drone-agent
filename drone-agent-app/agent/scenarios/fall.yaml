# 이 파일은 관리 콘솔이 배포할 때 자동으로 씁니다 (원천: data/console.db).
# 배포 버전 v2 · 2026-08-09 10:34
# 손으로 고쳐도 동작하지만, 다음 배포 때 덮어써집니다.
key: fall
name: 낙상 감지
target_event: fall
cooldown: 10.0
detect_prompt: |
  이 이미지를 보고 사람이 엎드려 있거나 넘어져 있는지 감지하라.
  반드시 아래 JSON 형식으로만 답하라, 코드펜스 금지:
  {"event": "fall" 또는 "none", "confidence": 0.0~1.0, "reason": "판단 근거를 한 문장으로"}
nudge_template: '[SYSTEM] 카메라 영상에서 사용자가 방금 쓰러지는 것이 감지되었습니다. 지금 하던 대화를 멈추고 걱정스러운 톤으로 ''괜찮으세요?''라고 즉시 물어보세요.'
instructions:
- 쓰러짐이 감지되면 즉시 걱정스러운 톤으로 "괜찮으세요?"라고 물어봅니다.
- 사용자가 괜찮지 않다고 답하거나 응답이 없으면 notify_caregiver 도구로 보호자에게 알립니다.
- 사용자가 명확히 괜찮다고 답하면 신고하지 않고 안심시키는 말로 마무리합니다.
action: notify_caregiver
