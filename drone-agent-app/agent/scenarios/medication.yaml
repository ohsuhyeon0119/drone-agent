# 복약 확인 시나리오. 이 파일을 수정하면 다음 서버 재시작(재연결)부터 반영된다.
# 이 파일을 지우거나 형식이 잘못되면 agent/scenarios.py의 DEFAULT_SCENARIOS로
# 자동 대체된다 — 즉 기존 하드코딩 동작으로 안전하게 되돌아간다.
key: medication
name: 복약 확인
target_event: taken
cooldown: 15.0

detect_prompt: |
  이 이미지를 보고 사람이 알약이나 물컵을 입 근처로 가져가
  약을 복용하는 동작을 하고 있는지 감지하라.
  반드시 아래 JSON 형식으로만 답하라, 코드펜스 금지:
  {"event": "taken" 또는 "none", "confidence": 0.0~1.0, "reason": "판단 근거를 한 문장으로"}

nudge_template: >-
  [SYSTEM] 방금 카메라로 사용자가 약을 복용하는 모습이 확인되었습니다.
  잘하셨다고 따뜻하게 칭찬하고 격려해주세요.

# 감지되면 에이전트가 지켜야 할 지침. 순서대로 페르소나에 반영된다.
instructions:
  - 복약 시간 신호를 받으면 처방 정보를 바탕으로 먼저 다정하게 복용을 권합니다.
  - 카메라로 복용이 확인되면 "잘하셨어요!"처럼 따뜻하게 칭찬합니다.
  - 아직 복용하지 않았다면 다그치지 않고 부드럽게 다시 권유합니다.

action: record_medication
