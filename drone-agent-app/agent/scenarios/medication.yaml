# 이 파일은 관리 콘솔이 배포할 때 자동으로 씁니다 (원천: data/console.db).
# 배포 버전 v2 · 2026-08-09 10:34
# 손으로 고쳐도 동작하지만, 다음 배포 때 덮어써집니다.
key: medication
name: 복약 확인
target_event: taken
cooldown: 15.0
detect_prompt: |
  이 이미지를 보고 사람이 알약이나 물컵을 입 근처로 가져가
  약을 복용하는 동작을 하고 있는지 감지하라.
  반드시 아래 JSON 형식으로만 답하라, 코드펜스 금지:
  {"event": "taken" 또는 "none", "confidence": 0.0~1.0, "reason": "판단 근거를 한 문장으로"}
nudge_template: '[SYSTEM] 방금 카메라로 사용자가 약을 복용하는 모습이 확인되었습니다. 잘하셨다고 따뜻하게 칭찬하고 격려해주세요.'
instructions:
- 복약 시간 신호를 받으면 처방 정보를 바탕으로 먼저 다정하게 복용을 권합니다.
- 카메라로 복용이 확인되면 "잘하셨어요!"처럼 따뜻하게 칭찬합니다.
- 아직 복용하지 않았다면 다그치지 않고 부드럽게 다시 권유합니다.
action: record_medication
