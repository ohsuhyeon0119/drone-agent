<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>동행이 — 약 복용</title>
<link rel="stylesheet" href="/static/shared.css" />
<style>
  .alert-overlay.good { background: rgba(31, 122, 104, 0.92); }
</style>
</head>
<body>
  <div class="topnav">
    <div class="brand"><span class="dot"></span> 동행이</div>
    <div class="tabs">
      <a href="/fall">낙상 감지</a>
      <a href="/medication" class="active">약 복용</a>
      <a href="/task">작업 보조</a>
    </div>
  </div>

  <div class="page-header">
    <p class="eyebrow">시나리오 C · 약 복용</p>
    <h1>먼저 챙기고, 확인하고, 기억합니다</h1>
    <p>정해진 시간에 동행이가 먼저 복약을 안내하고, 실제로 드시는 모습을 카메라로 확인해 메모리에 기록합니다.</p>
  </div>

  <div class="main-grid cols-3">
    <div class="card">
      <h2>실시간 카메라</h2>
      <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <div class="placeholder" id="video-placeholder">대화를 시작하면 카메라가 켜집니다</div>
        <div class="alert-overlay good" id="alert-overlay">✅ 복용 확인! 메모리에 기록했습니다</div>
      </div>
      <div class="controls">
        <button id="startBtn" class="btn primary">대화 시작</button>
        <button id="stopBtn" class="btn danger" disabled>종료</button>
        <span class="status-pill" id="statusPill"><span class="dot"></span> 대기 중</span>
      </div>
    </div>

    <div class="card">
      <h2>대화</h2>
      <div class="chat-log" id="chatLog"></div>
      <div class="input-row">
        <input type="text" id="textInput" placeholder="메시지 입력..." />
        <button id="sendBtn" class="btn">전송</button>
      </div>
    </div>

    <div class="card">
      <h2>개인화 메모리</h2>
      <div id="profileRows" style="flex: none"></div>
      <h2 style="margin-top: 12px">메모리 업데이트 로그</h2>
      <div class="event-log" id="memoryLog"></div>
    </div>
  </div>

  <canvas id="canvas" style="display:none"></canvas>

<script src="/static/media-handler.js"></script>
<script src="/static/gemini-client.js"></script>
<script>
const video = document.getElementById("video");
const videoPlaceholder = document.getElementById("video-placeholder");
const alertOverlay = document.getElementById("alert-overlay");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const statusPill = document.getElementById("statusPill");
const chatLog = document.getElementById("chatLog");
const memoryLog = document.getElementById("memoryLog");
const profileRows = document.getElementById("profileRows");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");

const mediaHandler = new MediaHandler();
let currentUserDiv = null;
let currentGeminiDiv = null;

async function loadState() {
  const res = await fetch("/api/medication/state");
  const data = await res.json();
  profileRows.innerHTML = "";
  const rows = [
    ["이름", data.profile.name],
    ["처방약", data.profile.medication],
    ["복용 예정 시각", data.profile.scheduled_time],
  ];
  rows.forEach(([k, v]) => {
    const row = document.createElement("div");
    row.className = "def-row";
    row.innerHTML = `<span class="k">${k}</span><span class="v">${v}</span>`;
    profileRows.appendChild(row);
  });
  memoryLog.innerHTML = "";
  data.logs.forEach((r) => addMemoryLine(`✅ ${r.timestamp} — ${r.medication} 복용 확인됨 (기존 기록)`));
}
loadState();

function addMemoryLine(text) {
  const line = document.createElement("div");
  line.className = "line good";
  line.textContent = text;
  memoryLog.appendChild(line);
  memoryLog.scrollTop = memoryLog.scrollHeight;
}

const client = new GeminiClient({
  wsPath: "/ws/medication",
  onOpen: async () => {
    statusPill.textContent = "연결됨";
    statusPill.classList.add("connected");
    startBtn.disabled = true;
    stopBtn.disabled = false;

    await mediaHandler.startAudio((data) => client.send(data));
    await mediaHandler.startVideo(video, (base64) => client.sendImage(base64));
    videoPlaceholder.style.display = "none";
  },
  onMessage: (event) => {
    if (typeof event.data === "string") {
      try {
        handleJson(JSON.parse(event.data));
      } catch (e) {
        console.error(e);
      }
    } else {
      mediaHandler.playAudio(event.data);
    }
  },
  onClose: () => {
    statusPill.textContent = "연결 끊김";
    statusPill.classList.remove("connected");
    startBtn.disabled = false;
    stopBtn.disabled = true;
  },
  onError: (e) => console.error("WS error", e),
});

function handleJson(msg) {
  if (msg.type === "interrupted") {
    mediaHandler.stopAudioPlayback();
    currentUserDiv = null;
    currentGeminiDiv = null;
  } else if (msg.type === "turn_complete") {
    currentUserDiv = null;
    currentGeminiDiv = null;
  } else if (msg.type === "user") {
    currentUserDiv = appendMsg("user", msg.text, currentUserDiv);
  } else if (msg.type === "gemini") {
    currentGeminiDiv = appendMsg("gemini", msg.text, currentGeminiDiv);
  } else if (msg.type === "memory_update") {
    alertOverlay.classList.add("show");
    setTimeout(() => alertOverlay.classList.remove("show"), 4000);
    addMemoryLine(msg.message);
  } else if (msg.type === "system_nudge") {
    appendMsg("system-nudge", "⚙️ " + msg.text);
  }
}

function appendMsg(cls, text, existing) {
  if (existing && (cls === "user" || cls === "gemini")) {
    existing.textContent += text;
    chatLog.scrollTop = chatLog.scrollHeight;
    return existing;
  }
  const div = document.createElement("div");
  div.className = "message " + cls;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  return div;
}

startBtn.onclick = async () => {
  await mediaHandler.initializeAudio();
  client.connect();
};

stopBtn.onclick = () => {
  client.disconnect();
  mediaHandler.stopAudio();
  mediaHandler.stopVideo(video);
  videoPlaceholder.style.display = "flex";
};

sendBtn.onclick = sendText;
textInput.onkeypress = (e) => { if (e.key === "Enter") sendText(); };
function sendText() {
  const text = textInput.value;
  if (text && client.isConnected()) {
    client.sendText(text);
    appendMsg("user", text);
    textInput.value = "";
  }
}
</script>
</body>
</html>
