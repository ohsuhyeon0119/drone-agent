<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>동행이 — 통합</title>
<link rel="stylesheet" href="/static/shared.css" />
<style>
  .alert-overlay.good { background: rgba(31, 122, 104, 0.92); }
</style>
</head>
<body>
  <div id="toast-container"></div>

  <div class="topnav">
    <div class="brand"><span class="dot"></span> 동행이</div>
  </div>

  <div class="page-header">
    <p class="eyebrow">노인 돌봄 드론 에이전트</p>
    <h1>어떤 상황인지, 동행이가 스스로 알아챕니다</h1>
    <p>낙상·복약·일반 대화를 한 세션에서 동시에 감지하고 알맞게 반응합니다.</p>
  </div>

  <div class="main-grid cols-3">
    <div class="card">
      <h2>실시간 카메라</h2>
      <div class="video-wrap">
        <video id="video" autoplay playsinline muted></video>
        <div class="placeholder" id="video-placeholder">대화를 시작하면 카메라가 켜집니다</div>
        <div class="alert-overlay" id="fall-alert-overlay">🚨 낙상 감지! 확인이 필요합니다</div>
        <div class="alert-overlay good" id="med-alert-overlay">✅ 복용 확인! 메모리에 기록했습니다</div>
      </div>
      <div class="controls">
        <button id="startBtn" class="btn primary">대화 시작</button>
        <button id="stopBtn" class="btn danger" disabled>종료</button>
        <span class="status-pill" id="statusPill"><span class="dot"></span> 대기 중</span>
        <button id="medReminderBtn" class="btn">💊 약 복용 알림 (5초 후)</button>
      </div>
    </div>

    <div class="card">
      <h2>대화</h2>
      <div class="chat-log" id="chatLog"></div>
      <div class="input-row">
        <input type="text" id="textInput" placeholder="메시지 입력..." />
        <button id="sendBtn" class="btn">전송</button>
      </div>
    </div>

    <div class="card">
      <h2>감지 로그 (낙상 + 복약 동시)</h2>
      <div class="event-log" id="eventLog" style="flex: 1.3"></div>
      <h2 style="margin-top: 12px">메모리 업데이트</h2>
      <div class="event-log" id="memoryLog" style="flex: 0.7"></div>
    </div>
  </div>

  <canvas id="canvas" style="display:none"></canvas>

<script src="/agent-static/media-handler.js"></script>
<script src="/agent-static/gemini-client.js"></script>
<script>
const video = document.getElementById("video");
const videoPlaceholder = document.getElementById("video-placeholder");
const fallAlertOverlay = document.getElementById("fall-alert-overlay");
const medAlertOverlay = document.getElementById("med-alert-overlay");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const medReminderBtn = document.getElementById("medReminderBtn");
const statusPill = document.getElementById("statusPill");
const chatLog = document.getElementById("chatLog");
const eventLog = document.getElementById("eventLog");
const memoryLog = document.getElementById("memoryLog");
const textInput = document.getElementById("textInput");
const sendBtn = document.getElementById("sendBtn");

const mediaHandler = new MediaHandler();
let currentUserDiv = null;
let currentGeminiDiv = null;

const client = new GeminiClient({
  wsPath: "/ws/unified",
  onOpen: async () => {
    statusPill.textContent = "연결됨";
    statusPill.classList.add("connected");
    startBtn.disabled = true;
    stopBtn.disabled = false;

    await mediaHandler.startAudio((data) => client.send(data));
    await mediaHandler.startVideo(video, (base64) => client.sendImage(base64));
    videoPlaceholder.style.display = "none";
  },
  onMessage: (event) => {
    if (typeof event.data === "string") {
      try {
        handleJson(JSON.parse(event.data));
      } catch (e) {
        console.error(e);
      }
    } else {
      mediaHandler.playAudio(event.data);
    }
  },
  onClose: () => {
    statusPill.textContent = "연결 끊김";
    statusPill.classList.remove("connected");
    startBtn.disabled = false;
    stopBtn.disabled = true;
  },
  onError: (e) => console.error("WS error", e),
});

function handleJson(msg) {
  if (msg.type === "interrupted") {
    mediaHandler.stopAudioPlayback();
    currentUserDiv = null;
    currentGeminiDiv = null;
  } else if (msg.type === "turn_complete") {
    currentUserDiv = null;
    currentGeminiDiv = null;
  } else if (msg.type === "user") {
    currentUserDiv = appendMsg("user", msg.text, currentUserDiv);
  } else if (msg.type === "gemini") {
    currentGeminiDiv = appendMsg("gemini", msg.text, currentGeminiDiv);
  } else if (msg.type === "alert") {
    fallAlertOverlay.classList.add("show");
    setTimeout(() => fallAlertOverlay.classList.remove("show"), 4000);
  } else if (msg.type === "system_nudge") {
    appendMsg("system-nudge", "⚙️ " + msg.text);
  } else if (msg.type === "tool_call") {
    appendMsg("tool-call", `🛠️ ${msg.name}(${JSON.stringify(msg.args)}) → ${msg.result}`);
  } else if (msg.type === "tool_result") {
    // 실제로 누구에게 전달됐는지 — 서버가 연락 대상을 확정한 뒤 보내준다
    const who = (msg.targets || []).map((t) => `${t.name}(${t.relation})`).join(", ");
    if (msg.tool === "notify_caregiver") {
      showToast(who ? "📨" : "⚠️",
        who ? `${who}에게 알림을 전송했습니다` : "등록된 연락처가 없어 알리지 못했습니다",
        msg.message || "", who ? "good" : "warn");
    } else if (msg.tool === "record_medication") {
      showToast("💊", "복용 기록을 남겼습니다", msg.note || "", "good");
    }
  } else if (msg.type === "detect_result") {
    appendEventLog(msg);
  } else if (msg.type === "memory_update") {
    medAlertOverlay.classList.add("show");
    setTimeout(() => medAlertOverlay.classList.remove("show"), 4000);
    addMemoryLine(msg.message);
  }
}

function showToast(icon, title, text, variant) {
  const container = document.getElementById("toast-container");
  const toast = document.createElement("div");
  toast.className = "toast" + (variant ? " " + variant : "");
  toast.innerHTML = `<span class="icon">${icon}</span><div class="body"><b>${title}</b><span></span></div>`;
  toast.querySelector(".body span").textContent = text;
  container.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add("show"));
  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => toast.remove(), 250);
  }, 5000);
}

function appendMsg(cls, text, existing) {
  if (existing && (cls === "user" || cls === "gemini")) {
    existing.textContent += text;
    chatLog.scrollTop = chatLog.scrollHeight;
    return existing;
  }
  const div = document.createElement("div");
  div.className = "message " + cls;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  return div;
}

function appendEventLog(msg) {
  const line = document.createElement("div");
  const t = new Date().toLocaleTimeString();
  const tag = msg.source === "fall" ? "🚨낙상" : "💊복약";
  if (msg.ok) {
    const hit = msg.event === "fall" || msg.event === "taken";
    line.className = "line" + (hit ? " hit" : "");
    line.textContent = `[${t}] ${tag} event=${msg.event} conf=${msg.confidence} — ${msg.reason || ""}`;
  } else {
    line.className = "line";
    line.textContent = `[${t}] ${tag} ERROR: ${msg.error}`;
  }
  eventLog.appendChild(line);
  eventLog.scrollTop = eventLog.scrollHeight;
  while (eventLog.children.length > 80) eventLog.removeChild(eventLog.firstChild);
}

function addMemoryLine(text) {
  const line = document.createElement("div");
  line.className = "line good";
  line.textContent = text;
  memoryLog.appendChild(line);
  memoryLog.scrollTop = memoryLog.scrollHeight;
}

startBtn.onclick = async () => {
  await mediaHandler.initializeAudio();
  client.connect();
};

stopBtn.onclick = () => {
  client.disconnect();
  mediaHandler.stopAudio();
  mediaHandler.stopVideo(video);
  videoPlaceholder.style.display = "flex";
};

const MED_BTN_DEFAULT_LABEL = "💊 약 복용 알림 (5초 후)";
medReminderBtn.onclick = () => {
  medReminderBtn.disabled = true;
  let secondsLeft = 5;
  medReminderBtn.textContent = `💊 ${secondsLeft}초 후 알림...`;
  const interval = setInterval(async () => {
    secondsLeft -= 1;
    if (secondsLeft > 0) {
      medReminderBtn.textContent = `💊 ${secondsLeft}초 후 알림...`;
      return;
    }
    clearInterval(interval);
    try {
      const res = await fetch("/api/remind-medication", { method: "POST" });
      const data = await res.json();
      if (!data.ok) alert(data.error || "전송 실패");
    } catch (e) {
      alert("요청 실패: " + e.message);
    } finally {
      medReminderBtn.disabled = false;
      medReminderBtn.textContent = MED_BTN_DEFAULT_LABEL;
    }
  }, 1000);
};

sendBtn.onclick = sendText;
textInput.onkeypress = (e) => { if (e.key === "Enter") sendText(); };
function sendText() {
  const text = textInput.value;
  if (text && client.isConnected()) {
    client.sendText(text);
    appendMsg("user", text);
    textInput.value = "";
  }
}
</script>
</body>
</html>
