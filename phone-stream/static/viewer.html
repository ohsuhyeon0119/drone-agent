<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🖥 수신 영상 뷰어</title>
<style>
  body {
    font-family: -apple-system, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  h1 { font-size: 1.1rem; margin: 0; }
  img { width: 640px; max-width: 92vw; border-radius: 8px; background: #000; min-height: 240px; }
  #stats {
    font-family: monospace;
    font-size: 0.95rem;
    background: #1c1c1c;
    padding: 12px 16px;
    border-radius: 8px;
    width: 640px;
    max-width: 92vw;
    box-sizing: border-box;
    white-space: pre-wrap;
  }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #777; margin-right: 6px; }
  .dot.on { background: #22c55e; }
</style>
</head>
<body>
  <h1><span id="wsDot" class="dot"></span>서버 수신 영상 (실시간 검증용 뷰어)</h1>
  <img id="frame" alt="아직 수신된 프레임 없음" />
  <div id="stats">연결 중...</div>

<script>
const img = document.getElementById("frame");
const statsEl = document.getElementById("stats");
const wsDot = document.getElementById("wsDot");

let frameCount = 0;
let recvTimes = [];
let lastUrl = null;

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws/viewer`);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => { wsDot.classList.add("on"); statsEl.textContent = "연결됨 — 프레임 대기 중..."; };
  ws.onclose = () => {
    wsDot.classList.remove("on");
    statsEl.textContent = "연결 끊김 — 2초 후 재연결...";
    setTimeout(connect, 2000);
  };

  ws.onmessage = (ev) => {
    const dv = new DataView(ev.data);
    const captureTs = dv.getFloat64(0, true);  // 서버시계 기준 폰 캡처 시각
    const recvTs = dv.getFloat64(8, true);     // 서버 수신 시각
    const jpeg = new Blob([ev.data.slice(16)], { type: "image/jpeg" });

    const url = URL.createObjectURL(jpeg);
    img.src = url;
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = url;

    frameCount++;
    const now = performance.now();
    recvTimes.push(now);
    if (recvTimes.length > 100) recvTimes.splice(0, 50);
    const window5s = recvTimes.filter((t) => now - t < 5000);

    statsEl.textContent = [
      `수신 프레임: ${frameCount}`,
      `수신 fps(5s): ${(window5s.length / 5).toFixed(1)}`,
      `폰→서버 지연: ${Math.round(recvTs - captureTs)} ms`,
      `프레임 크기: ${Math.round(jpeg.size / 1024)} KB`,
    ].join("\n");
  };
}
connect();
</script>
</body>
</html>
